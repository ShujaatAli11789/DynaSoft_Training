
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        form {
            width: 90%;
            max-width: 450px;
            padding: 30px;
            background: #ffffff;
            border-radius: 18px;
            border: 1px solid gray;

            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

       
        input {
            width: 100%;
            padding: 13px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            outline: none;
            font-size: 16px;
            transition: 0.3s;
        }

        input:focus {
            border-color: #4c6fff;
            box-shadow: 0 0 0 3px rgba(76, 111, 255, 0.15);
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #264ad9, #4c6fff);
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
          
        }

        #items {
            width: 100%;
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .item  {
            width: 100%;
            padding: 12px 15px;
            background: #f5f7ff;
            border-left: 4px solid #4c6fff;
            border-radius: 8px;
            color: #333;
        }
        #top{
            font: bold;
            font-size: 20px;

        }
        .error{
            background-color: red;
            color: white;
            font: bold;
            font-size: 20px;
        }
    </style>
</head>

<body>

    <form id="form">
        <div id="top">Hi, add a Name</div>
        <input id="input" type="text" placeholder="Enter name...">
        <button type="submit">Enter</button>

        <div id="items"></div>
    </form>
<script src="script.js"></script>
</body>
</html>
