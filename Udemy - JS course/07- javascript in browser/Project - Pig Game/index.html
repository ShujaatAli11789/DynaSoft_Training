<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pig Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="gameContiainer">
      <div id="controls">
        <div id="newGame">🔃 NEW GAME</div>
        <div id="dice"><img src="assets/dice-1.png" alt="" /></div>
        <button id="rollDiceBtn">🎲ROLL DICE</button>
        <button id="hold">📥 HOLD</button>
      </div>
      <div id="player1" class="player active">
        <div class="playerIntro">
          <p>Player 1</p>
          <div id="player1Score" class="score">0</div>
        </div>
        <div class="currentScoreDisplayContiner">
          <div class="current">CURRENT</div>
          <div id="player1Roll" class="score">0</div>
        </div>
      </div>

      <div id="player2" class="player">
        <div class="playerIntro">
          <p>Player 2</p>
          <div id="player2Score" class="score">0</div>
        </div>
        <div class="currentScoreDisplayContiner">
          <div class="current">CURRENT</div>
          <div id="player2Roll" class="score">0</div>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
