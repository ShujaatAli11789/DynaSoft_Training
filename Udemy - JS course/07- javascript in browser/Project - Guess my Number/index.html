<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guess the number</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <button id="reset">Again!</button>
      <span>(Between 1 and 20)</span>
    </header>
    <div>
      <p id="mainHeading">Guess My Number!</p>
      <div id="actualNumberContainer">
        <p id="whiteLine"></p>
        <div id="actualNumberDisplay">? </div>
      </div>

      <div id="controls">
        <div class="halfControls">
          <input id="input" type="number" min="1" max="20" />
          <button id="check">Check!</button>
        </div>

        <div class="halfControls">
          <p id="guessCheckRes">Start Guessing</p>
          <p>Score: <span id="score"></span></p>
          <p>Highscore: <span id="highscore"></span></p>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
